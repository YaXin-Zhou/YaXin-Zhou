      <stop offset="0" stop-color="#070B18"/>
      <stop offset="0.52" stop-color="#11152A"/>
      <stop offset="1" stop-color="#081B27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">

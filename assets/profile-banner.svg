    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="180" cy="90" rx="310" ry="235" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="1060" cy="315" rx="330" ry="210" fill="#0891B2" fill-opacity=".13" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
